<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моделирование малых модульных реакторов</title>
    <link rel="stylesheet" href="/static/styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header>
    <div class="header-content">
        <img src="/static/img/logo1.png" style="width: 100px; height: auto;">
        <div class="site-title">
            <h1>Моделирование малых модульных реакторов</h1>
            <p>Удобный калькулятор ММР</p>
        </div>
    </div>
</header>
<div class="action-bar">
    <a href="/" class="nav-item">
        <button class="btn">Главная</button>
    </a>
</div>
<div class="detail-wrapper">
    <div class="detail-card">
        <!-- Видео на весь фон -->
        <div class="detail-card__video-wrap">
            <video class="detail-card__video" controls autoplay muted loop playsinline>
                <source src="{{ .model.Video }}" type="video/mp4">
            </video>
            <!-- Опционально: затемняющий оверлей для читаемости текста -->
            <div class="detail-card__overlay"></div>
        </div>

        <!-- Текст поверх видео -->
        <div class="detail-card__content">
            <div class="detail-card__body">
                <h1 class="detail-card__title">{{ .model.Title }}</h1>
                <div class="detail-card__params">
                    <span>Мощность: {{ .model.Power }}</span>
                    <span>Расход топлива: {{ .model.FuelUsage }}</span>
                </div>
                <p class="detail-card__description">{{ .model.Description }}</p>
                <form method="POST" action="/nuclear_calculations/add" style="margin-top: 24px;">
                    <input type="hidden" name="model_id" value="{{ .model.ModelID }}">
                    <button type="submit" class="btn">Добавить в заявку</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
